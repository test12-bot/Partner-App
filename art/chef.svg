<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 30 380 330"><style>@keyframes bob{50%{transform:translateY(-3px)}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pin{50%{transform:translateY(-8px)}}@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes tw{0%,100%{transform:scale(.75) rotate(0)}50%{transform:scale(1.1) rotate(20deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}12%{transform:scale(1.07,.9)}45%{transform:translateY(-22px) scale(.96,1.05)}75%{transform:translateY(0)}82%{transform:scale(1.05,.94)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes nt{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
@keyframes rain{to{transform:translateY(40px)}}@keyframes hand{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
.bob{animation:bob .5s ease-in-out infinite}.wh{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.pin{transform-box:fill-box;transform-origin:bottom;animation:pin 1.4s ease-in-out infinite}
.fl{animation:fl 2.4s ease-in-out infinite}.fl2{animation:fl 3s ease-in-out infinite .8s}
.tw,.tw2{transform-box:fill-box;transform-origin:center;animation:tw 2s ease-in-out infinite}.tw2{animation-delay:1s}
.hop{transform-box:fill-box;transform-origin:bottom center;animation:hop 1.5s ease-in-out infinite}
.bl{transform-box:fill-box;transform-origin:center;animation:blink 3.8s infinite}
.nt{transform-box:fill-box;transform-origin:center;animation:nt 2.4s ease-in-out infinite}.nt2{transform-box:fill-box;transform-origin:center;animation:nt 2.8s ease-in-out infinite .6s}
.s1{animation:steam 2s ease-out infinite}.s2{animation:steam 2s ease-out infinite 1s}
.rain{animation:rain .8s linear infinite}.hand1{animation:hand 3s linear infinite}.spin2{animation:hand 12s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes ding{0%,60%,100%{transform:rotate(0)}66%{transform:rotate(-14deg)}76%{transform:rotate(12deg)}86%{transform:rotate(-6deg)}}
.ding{transform-box:fill-box;transform-origin:bottom center;animation:ding 2s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sw{transform-box:fill-box;transform-origin:top center;animation:sw 2.4s ease-in-out infinite}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2);opacity:0}}
